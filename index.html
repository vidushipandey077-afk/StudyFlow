<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyFlow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="dashboard">
        <h1 id="logo">StudyFlow</h1>
        <p id="quote">Every Small Progress Counts</p>
        <div id="cards">
            <div class="card" id="dailyTaskCard">
                <h3>Daily Tasks</h3>
                <p>Pending: <span id="pendingTaskCard">0</span></p>
            </div>
            <div class="card">
                <h3>Exam Tracker</h3>
                <p>No upcoming exams</p>
            </div>
            <div class="card">
                <h3>Weekly Goals</h3>
                <p>Set Goal</p>
            </div>
            <div class="card">
                <h3>Progress</h3>
                <p>0%</p>
            </div>
        </div>
    </div>
    <div id="dailyTasks">
        <h2>Daily Tasks</h2>
        <div id="task-input-area">
            <input type="text" id="taskInput" placeholder="Enter your Task">
            <button id="addButton">＋ Add</button><br>
        </div><br>
        <div id="taskList"></div><br>
        <div class="status" id="pending">Pending: <span id="pendingCount"></span></div>
        <div class="status" id="completed">Completed: <span id="completedCount"></span></div><br>
        <button id="backButton">← Back</button>
    </div>
</body>
<script src="script.js"></script>
</html>
