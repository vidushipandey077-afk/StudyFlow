<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyFlow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 id="logo">StudyFlow</h1>
    <p id="quote">Every Small Progress Counts</p>
    <div id="cards">
        <div class="card">
            <h3>Daily Tasks</h3>
            <p>Pending: 0</p>
        </div>
        <div class="card">
            <h3>Exam Tracker</h3>
            <p>No upcoming exams</p>
        </div>
        <div class="card">
            <h3>Weekly Goals</h3>
            <p>Set Goal</p>
        </div>
        <div class="card">
            <h3>Progress</h3>
            <p>0%</p>
        </div>
    </div>
</body>
</html>
